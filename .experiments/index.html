<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Argon Workflow Live Demo</title>
    <style>
      :root {
        --border: #e2e2e2;
        --panel-bg: #fff;
        --soft-bg: #fafafa;
        --text-muted: #666;
        --node-stroke: #888;
        --node-active: #f08a24;
        --node-failed: #c00;
        --node-done: #0a7;
        --node-active-bg: #fff4e8;
        --node-failed-bg: #ffecec;
        --node-done-bg: #f0fff8;
        --edge: #aaa;
        --edge-active: #f08a24;
        --edge-finished: #1f9d55;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
      }
      .panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        align-items: stretch;
        height: calc(100vh - 140px);
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        background: var(--panel-bg);
        display: flex;
        flex-direction: column;
        min-height: 0;
        position: relative;
        overflow: hidden;
      }
      .argon-status {
        position: absolute;
        top: 24px;
        left: 24px;
        right: 24px;
        font-size: 13px;
        color: var(--text-muted);
        pointer-events: none;
      }
      argon-graph svg {
        width: 100%;
        height: 100%;
        min-height: 320px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--soft-bg);
        flex: 1;
      }
      .node {
        fill: #ffffff;
        stroke: var(--node-stroke);
        stroke-width: 1.5;
        rx: 6;
        ry: 6;
        transition: stroke 120ms ease, fill 120ms ease;
      }
      .node.active {
        stroke: var(--node-active);
        fill: var(--node-active-bg);
      }
      .node.failed {
        stroke: var(--node-failed);
        fill: var(--node-failed-bg);
      }
      .node.done {
        stroke: var(--node-done);
        fill: var(--node-done-bg);
      }
      .edge {
        stroke: var(--edge);
        stroke-width: 2;
        marker-end: url(#arrow);
        transition: stroke 120ms ease, stroke-width 120ms ease;
      }
      .edge.active {
        stroke: var(--edge-active);
      }
      .edge.finished {
        stroke: var(--edge-finished);
      }
      .argon-log {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        white-space: pre-wrap;
        border: 1px solid var(--border);
        padding: 12px;
        border-radius: 6px;
        flex: 1;
        min-height: 0;
        height: 100%;
        overflow: auto;
        background: var(--soft-bg);
      }
    </style>
  </head>
  <body>
    <h1>Argon Workflow Live Demo</h1>
    <p>Listening for workflow events…</p>

    <div class="panel">
      <argon-graph class="card">
        <div class="argon-status">Status: idle</div>
        <svg viewBox="0 0 600 220" role="img" aria-label="Workflow graph"></svg>
      </argon-graph>
      <argon-log class="card">
        <div class="argon-log"></div>
      </argon-log>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
